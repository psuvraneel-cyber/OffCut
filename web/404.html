<!doctype html>

    <meta name="theme-color" content="#120b24" />

    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <link rel="manifest" href="/site.webmanifest" />

  <body class="not-found-page">
    <header class="legal-header">
      <div class="legal-header__inner">
        <a class="legal-header__logo" href="/" aria-label="Offcut home">
          <span class="logo">
            <svg class="logo__mark" viewBox="0 0 64 64" aria-hidden="true">
              <g transform="translate(1.5 5)">
                <rect class="logo__frame" x="4" y="20" width="44" height="28" rx="5" fill="none" stroke-width="3.5" />
                <rect class="logo__frame" x="30" y="20" width="12" height="28" fill="none" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.6" />
                <g class="logo__slice">
                  <rect x="37" y="6" width="19" height="34" rx="4" fill="#7a4dff" />
                  <path d="M43.5 17v12l9-6z" fill="#f1ecff" />

              </g>
            </svg>
            <span class="logo__word">offcut</span>

    <main class="not-found">
      <p class="mono not-found__code">Error 404</p>
      <h1>This page ended up <em>on the cutting-room floor</em>.</h1>
      <p class="not-found__lede">

      </p>
      <div class="not-found__actions">
        <a class="button button--primary" href="/">Back to Offcut</a>
        <a class="button not-found__secondary" href="/#roadmap">See the roadmap</a>
      </div>
    </main>

    <footer class="legal-footer">
      <div class="legal-footer__inner">
        <p>© 2026 Offcut · Built in public</p>
        <nav aria-label="Legal">
          <a href="/privacy">Privacy</a>

    </footer>
